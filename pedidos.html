<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dolce.vida">

    <link rel="apple-touch-icon" href="icon-192.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dolce.vida - Nuevo Pedido</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="app-header">
        <h1>📋 Dolce.vida</h1>
        <p>Registrar Nuevo Pedido</p>
    </header>

    <main class="app-container">
        <section class="form-section">
            
            <form id="form-nuevo-pedido" class="styled-form">
                
                <div class="form-group">
                    <label for="cliente">Nombre del Cliente:</label>
                    <input type="text" id="cliente" placeholder="Ej. María González" required>
                </div>

                <div class="form-group">
                    <label for="producto">Producto:</label>
                    <select id="producto" required>
                        <option value="" disabled selected>Selecciona un producto...</option>
                        <option value="pastel-tres-leches">Pastel de Tres Leches</option>
                        <option value="cupcakes-vainilla">Cupcakes de Vainilla (x12)</option>
                        <option value="cheesecake-fresa">Cheesecake de Fresa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="fecha-entrega">Fecha de Entrega:</label>
                    <input type="date" id="fecha-entrega" required>
                </div>

                <div class="form-group">
                    <label for="hora-entrega">Hora de Entrega:</label>
                    <input type="time" id="hora-entrega" required>
                </div>

                <div class="form-group">
                    <label for="notas">Notas Especiales / Detalles:</label>
                    <textarea id="notas" rows="3" placeholder="Ej. Letrero que diga 'Feliz Cumple Pá', empaque para regalo..."></textarea>
                </div>

                <button type="submit" class="btn-submit">💾 Guardar Pedido</button>
            </form>

        </section>
    </main>

<!-- Barra de Navegación Inferior Actualizada -->

        <a href="index.html" class="nav-item">🏠 Inicio</a>
        <a href="pedidos.html" class="nav-item active">📋 Pedidos</a>
        <a href="inventario.html" class="nav-item">📦 Stock</a>
        <a href="recetas.html" class="nav-item">📖 Recetas</a>
        <a href="analisis.html" class="nav-item">📊 Análisis</a>
    </nav>
    <script src="js/api.js"></script>
    <script src="js/pedidos.js"></script>
</body>
</html>
